[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posttrain"
version = "0.1.0"
description = "RLVR post-training for competitive programming (CodeContests)"
requires-python = ">=3.11"
# Runtime deps are installed by hand per docs/README.md (torch/vLLM need the
# cu128 index), so they are deliberately not pinned here.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a CUDA GPU (skip with -m 'not gpu')",
    "slow: long-running (network / full-split) test",
]
